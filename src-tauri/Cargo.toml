[package]
name = "quickload"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "A quiet home for all your games"

[lib]
name = "quickload_app"
crate-type = ["rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quickload-core = { path = "../crates/quickload-core" }
imagesize = { version = "=0.15.0", default-features = false, features = ["jpeg", "png", "webp"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
open = "5"
tempfile = "3"
tokio = { version = "1", features = ["sync"] }
quick-xml = "0.42.0"

[target.'cfg(windows)'.dependencies]
auto-launch = "=0.6.0"
