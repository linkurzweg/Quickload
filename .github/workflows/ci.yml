name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
env:
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.tools/browsers
jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: '.node-version' }
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm desktop:build --no-bundle
      - if: vars.QUICKLOAD_PUBLISH_RELEASES == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quickload-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/quickload
            target/release/quickload.exe
            target/release/WebView2Loader.dll
